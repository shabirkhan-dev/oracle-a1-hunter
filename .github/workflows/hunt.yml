# Every 10 minutes, ask Oracle Cloud for a free Ampere A1 machine until one exists; then open an
# issue saying so (GitHub notifies you) and turn this workflow off.
name: Hunt for a free Oracle A1 machine

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Until the secrets are added, each run just says so and passes, instead of failing (and
      # emailing you) every 10 minutes.
      - name: Check the secrets are set
        id: ready
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          if [ -n "$OCI_TENANCY_OCID" ] && [ -n "$OCI_PRIVATE_KEY" ] && [ -n "$SSH_PUBLIC_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Add the secrets listed in README.md to start hunting."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - name: Install the OCI CLI
        if: steps.ready.outputs.ok == 'true'
        run: pipx install oci-cli

      - name: Sign in to Oracle Cloud
        if: steps.ready.outputs.ok == 'true'
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_PRIVATE_KEY" > ~/.oci/key.pem
          cat > ~/.oci/config <<CONFIG
          [DEFAULT]
          user=$OCI_USER_OCID
          fingerprint=$OCI_FINGERPRINT
          tenancy=$OCI_TENANCY_OCID
          region=$OCI_REGION
          key_file=$HOME/.oci/key.pem
          CONFIG
          chmod 600 ~/.oci/config ~/.oci/key.pem

      - name: Prepare the machine's key and first boot
        if: steps.ready.outputs.ok == 'true'
        env:
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          printf '%s\n' "$SSH_PUBLIC_KEY" > "$RUNNER_TEMP/key.pub"
          if [ -n "$TS_AUTHKEY" ]; then
            sed "s|__TS_AUTHKEY__|$TS_AUTHKEY|" cloud-init.template.yaml > "$RUNNER_TEMP/cloud-init.yaml"
          else
            grep -v 'tailscale' cloud-init.template.yaml > "$RUNNER_TEMP/cloud-init.yaml"
          fi

      - name: Ask for a machine
        if: steps.ready.outputs.ok == 'true'
        id: hunt
        env:
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          SSH_KEY_FILE: ${{ runner.temp }}/key.pub
          USER_DATA_FILE: ${{ runner.temp }}/cloud-init.yaml
        run: |
          set +e
          ./hunt.sh
          code=$?
          # 2 means "no capacity this time": not a failure, just try again later.
          [ "$code" = 2 ] && exit 0
          exit "$code"

      # GitHub's schedule is unreliable (new repos especially can go hours without a run), so each
      # try queues the next one itself. The schedule above stays as a backup, and the concurrency
      # group keeps it to one run at a time. It stops once the machine exists.
      - name: Queue the next try
        if: steps.ready.outputs.ok == 'true' && steps.hunt.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 480
          gh workflow run hunt.yml --ref "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}"

      - name: Tell you, and stop hunting
        if: steps.hunt.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.hunt.outputs.detail }}
          CREATED: ${{ steps.hunt.outputs.created }}
        run: |
          if [ "$CREATED" = true ]; then
            gh issue create --title "Got a free Oracle A1 machine" --body "Created: ${DETAIL}. It joins your tailnet as \"grid\" in a few minutes (if TS_AUTHKEY is set). Hunting is now off."
          fi
          gh workflow disable hunt.yml
